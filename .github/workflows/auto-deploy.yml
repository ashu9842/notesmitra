name: Auto Deploy Render + Vercel

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  trigger-deploy-hooks:
    runs-on: ubuntu-latest

    steps:
      - name: Trigger configured deploy hooks
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          set -euo pipefail

          triggered=0

          if [ -n "${RENDER_DEPLOY_HOOK_URL:-}" ]; then
            echo "Triggering Render deploy hook..."
            curl --fail --show-error --silent --request POST "$RENDER_DEPLOY_HOOK_URL"
            triggered=1
          else
            echo "RENDER_DEPLOY_HOOK_URL is not set"
          fi

          if [ -n "${VERCEL_DEPLOY_HOOK_URL:-}" ]; then
            echo "Triggering Vercel deploy hook..."
            curl --fail --show-error --silent --request POST "$VERCEL_DEPLOY_HOOK_URL"
            triggered=1
          else
            echo "VERCEL_DEPLOY_HOOK_URL is not set"
          fi

          if [ "$triggered" -eq 0 ]; then
            echo "::warning::No deploy hooks configured. Add GitHub secrets RENDER_DEPLOY_HOOK_URL and/or VERCEL_DEPLOY_HOOK_URL"
          fi
