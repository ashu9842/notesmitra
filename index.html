
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- Primary SEO -->
    <title>NotesMitra – Buy &amp; Sell Academic Notes | India's #1 Notes Marketplace</title>
    <meta name="description" content="NotesMitra is India's #1 academic notes marketplace. Buy quality study notes, sell your notes and earn 80% commission. Trusted by 10,000+ students. Instant download, secure payments." />
    <meta name="keywords" content="buy notes online, sell study notes, academic notes marketplace, India notes marketplace, college notes, university notes, earn from notes, study material, NotesMitra" />
    <meta name="author" content="NotesMitra" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://notesmitra.in/" />

    <!-- Theme & App -->
    <meta name="theme-color" content="#4f46e5" />
    <meta name="msapplication-TileColor" content="#4f46e5" />
    <meta name="application-name" content="NotesMitra" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="NotesMitra" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <!-- Favicons -->
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="apple-touch-icon" href="/logo.svg" />

    <!-- Open Graph (Facebook / WhatsApp / LinkedIn) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="NotesMitra" />
    <meta property="og:title" content="NotesMitra – Buy &amp; Sell Academic Notes | India's #1 Notes Marketplace" />
    <meta property="og:description" content="India's #1 academic notes marketplace. Earn 80% commission selling notes. Instant download for buyers. Trusted by 10,000+ students across India." />
    <meta property="og:url" content="https://notesmitra.in/" />
    <meta property="og:image" content="https://notesmitra.in/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="en_IN" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@notesmitra" />
    <meta name="twitter:title" content="NotesMitra – India's #1 Academic Notes Marketplace" />
    <meta name="twitter:description" content="Buy and sell quality academic notes. Earn 80% commission. Trusted by 10,000+ students across India." />
    <meta name="twitter:image" content="https://notesmitra.in/og-image.png" />

    <!-- Structured Data (Organization) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "NotesMitra",
      "url": "https://notesmitra.in",
      "logo": "https://notesmitra.in/logo.svg",
      "description": "India's #1 academic notes marketplace where students buy and sell quality study notes.",
      "sameAs": []
    }
    </script>

    <!-- Structured Data (WebSite with SearchAction) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "NotesMitra",
      "url": "https://notesmitra.in",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://notesmitra.in/?q={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>

    <!-- Performance: Preconnect -->
    <link rel="preconnect" href="https://checkout.razorpay.com" />
    <link rel="dns-prefetch" href="https://checkout.razorpay.com" />

  </head>

    <body>
      <div id="root"></div>
      <script type="module" src="/src/main.tsx"></script>
    </body>
  </html>
